<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>match3-playable</title>

    <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1" />

    <style type="text/css">
        html {
            -ms-touch-action: none;
        }

        body,
        canvas,
        div {
            margin: 0;
            padding: 0;
            outline: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -khtml-user-select: none;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }

        body {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            margin: 0;

            cursor: default;
            background-color: #333;

            display: flex;
            flex-direction: column;
        }

        canvas {
            background-color: rgba(0, 0, 0, 0);
        }

        /* Only rendered into if GameEngine's `showStats` config is true (default) — see
           GameEngine.js's `fpsLabel` lookup (`document.getElementById('fps')`). Remove
           this element (and `showStats: false`) if you don't want the overlay at all. */
        #fps {
            margin: 0;
            padding: 6px 6px;
            font-size: 2em;
            color: #000;
            font-weight: 600;
            line-height: 1em;
            text-align: left;
        }

        .GameStats {
            position: absolute;
            left: 0;
            bottom: 0;
            background: #01ff01;
            display: none;
            font-size: 6px;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas" width="0" height="0"></canvas>
    <div id="stats" class='GameStats'>
        <p id="fps"></p>
    </div>
    <script type="module" src="src/index.ts"></script>
</body>

</html>
